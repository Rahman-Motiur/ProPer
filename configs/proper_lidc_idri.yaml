seed: 42
run_dir: runs/proper_lidc_idri

data:
  train_csv: data/lidc_train.csv
  image_size: [128, 128]
  rater_columns: [rater_1, rater_2, rater_3, rater_4]

model:
  image_channels: 1
  num_classes: 2
  num_raters: 4
  base_channels: 32
  prompt_dim: 64
  latent_dim: 64
  initial_prompt_threshold: 0.95

training:
  epochs: 200
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 2
  encoder_kl_weight: 1.0
  decoder_kl_weight: 1.0
  personalized_weight: 1.0
  mean_weight: 1.0
  diversification_weight: 1.0
